<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cadFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background hex base -->
  <rect width="64" height="64" rx="14" fill="#0b0f19"/>
  <!-- Outer glowing diamond contour -->
  <polygon points="32,6 56,22 46,56 18,56 8,22" fill="none" stroke="url(#gemGrad)" stroke-width="2" filter="url(#glow)"/>
  <!-- Upper facets -->
  <polygon points="32,6 56,22 42,26 32,16" fill="url(#cadFacet)" stroke="#00f2fe" stroke-width="1.2"/>
  <polygon points="32,6 8,22 22,26 32,16" fill="url(#cadFacet)" stroke="#00f2fe" stroke-width="1.2"/>
  <polygon points="32,16 42,26 22,26" fill="#0284c7" stroke="#38bdf8" stroke-width="1.2"/>
  <!-- Central & Lower facets -->
  <polygon points="22,26 42,26 32,56" fill="url(#gemGrad)" stroke="#67e8f9" stroke-width="1.2"/>
  <polygon points="8,22 22,26 18,56 8,22" fill="#0f172a" stroke="#00f2fe" stroke-width="1.2"/>
  <polygon points="56,22 42,26 46,56 56,22" fill="#0f172a" stroke="#00f2fe" stroke-width="1.2"/>
  <polygon points="22,26 18,56 32,56" fill="#0369a1" stroke="#38bdf8" stroke-width="1.2"/>
  <polygon points="42,26 46,56 32,56" fill="#0284c7" stroke="#38bdf8" stroke-width="1.2"/>
  <!-- Vertex accent dots -->
  <circle cx="32" cy="6" r="2.5" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="56" cy="22" r="2" fill="#00f2fe"/>
  <circle cx="8" cy="22" r="2" fill="#00f2fe"/>
  <circle cx="32" cy="56" r="2.5" fill="#38bdf8" filter="url(#glow)"/>
</svg>
